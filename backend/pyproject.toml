[project]
name = "emhass-lens"
version = "0.1.0"
description = "EMHASS Lens: a Home Assistant App that feeds, runs and explains EMHASS"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "holidays>=0.80",
    "websockets>=15",
    "aiomqtt>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "pyright>=1.1.406",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emhass_lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "ASYNC109"]

[tool.pyright]
include = ["emhass_lens", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
