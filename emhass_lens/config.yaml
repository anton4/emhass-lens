name: EMHASS Lens
version: "0.3.19"
slug: emhass_lens
description: A companion App for EMHASS that feeds it prices and forecasts, runs it on schedule and shows what it planned and why
url: https://github.com/anton4/emhass-lens
stage: experimental
arch:
  - amd64
  - aarch64
# Prebuilt by .github/workflows/addon-image.yml. Remove this line to build locally from the Dockerfile.
image: ghcr.io/anton4/emhass-lens-{arch}
ingress: true
panel_icon: mdi:chart-timeline-variant-shimmer
panel_title: EMHASS Lens
# REST + WebSocket access to Home Assistant through the Supervisor proxy
homeassistant_api: true
# Supervisor API: find the EMHASS App's address, read the MQTT broker credentials, list backups (Health → Storage)
hassio_api: true
hassio_role: backup
services:
  - mqtt:want
# Backups: app.db (settings, prices, plans, measurements) is copied live after a WAL checkpoint and an integrity
# check (backup_pre); run details and logs are bulky and rebuilt over time, so runs.db stays out
backup_pre: python -m emhass_lens.backup_pre
backup_post: python -m emhass_lens.backup_post
backup_exclude:
  - "runs.db*"
# Direct access without the Home Assistant login is off by default and read-only when enabled
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Web UI and API, read-only (not needed with Ingress)
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
